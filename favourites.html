
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favourites - HikeBuddy</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <header class="header">
        <h1>Favourites</h1>
        <p>Your saved hiking routes</p>
    </header>

    <main>

        <section class="welcome">
            <h2>Saved hikes</h2>
            <p>Keep your favourite Scottish adventures in one place.</p>
        </section>

        <section id="favourites-list"></section>

    </main>

    <nav class="bottom-nav">
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="favourites.html" class="active">Favourites</a>
    </nav>

    <script>

        const favourites = JSON.parse(
            localStorage.getItem("favourites")
        ) || [];

        const list = document.getElementById("favourites-list");

        const hikes = {
            "arthurs-seat": {
                name: "Arthur's Seat",
                location: "Edinburgh, Scotland",
                distance: "5 km",
                duration: "2 hrs",
                difficulty: "Easy",
                image: "images/arthurs-seat.jpg",
                alt: "Arthur's Seat in Edinburgh"
            },

            "ben-lomond": {
                name: "Ben Lomond",
                location: "Loch Lomond, Scotland",
                distance: "12 km",
                duration: "5 hrs",
                difficulty: "Hard",
                image: "images/ben-lomond.jpg",
                alt: "Ben Lomond in Scotland"
            },

            "the-hermitage": {
                name: "The Hermitage",
                location: "Dunkeld, Scotland",
                distance: "4 km",
                duration: "1.5 hrs",
                difficulty: "Easy",
                image: "images/the-hermitage.jpg",
                alt: "The Hermitage in Dunkeld"
            },

            "loch-an-eilein": {
                name: "Loch an Eilein",
                location: "Cairngorms, Scotland",
                distance: "7 km",
                duration: "2 hrs",
                difficulty: "Moderate",
                image: "images/loch-an-eilein.jpg",
                alt: "Loch an Eilein in the Cairngorms"
            },

            "cairn-gorm": {
                name: "Cairn Gorm",
                location: "Cairngorms, Scotland",
                distance: "10 km",
                duration: "4 hrs",
                difficulty: "Hard",
                image: "images/cairn-gorm.jpg",
                alt: "Cairn Gorm in the Cairngorms"
            }
        };

        if (favourites.length === 0) {

            list.innerHTML = `
                <div class="empty-favourites">
                    <h3>No saved hikes yet</h3>
                    <p>
                        Explore some hikes and save your favourites
                        to see them here.
                    </p>
                </div>
            `;

        } else {

            favourites.forEach(function(hikeId) {

                const hike = hikes[hikeId];

                if (!hike) return;

                list.innerHTML += `
                    <a class="hike-card favourite-card"
                       href="hike-details.html?hike=${hikeId}&from=favourites">

                        <div class="hike-image">
                            <img src="${hike.image}" alt="${hike.alt}">
                        </div>

                        <div class="hike-info">
                            <h3>${hike.name}</h3>
                            <p>${hike.location}</p>

                            <div class="hike-details">
                                <span>${hike.distance}</span>
                                <span>${hike.duration}</span>
                                <span>${hike.difficulty}</span>
                            </div>
                        </div>

                    </a>
                `;
            });

            function updateExpandedCard() {

                const cards = document.querySelectorAll(".favourite-card");

                const anchor = 160;
                let activeCard = null;
                let closestDistance = Infinity;

                cards.forEach(function(card) {

                    const rect = card.getBoundingClientRect();

                    if (rect.top <= anchor && rect.bottom > anchor) {
                        activeCard = card;
                    }

                    const distance = Math.abs(rect.top - anchor);

                    if (!activeCard && distance < closestDistance) {
                        closestDistance = distance;
                        activeCard = card;
                    }
                });

                cards.forEach(function(card) {
                    card.classList.toggle(
                        "is-expanded",
                        card === activeCard
                    );
                });
            }

            window.addEventListener("scroll", updateExpandedCard, {
                passive: true
            });

            window.addEventListener("resize", updateExpandedCard);

            updateExpandedCard();

        }

    </script>

</body>
</html>
